# Per-provider LLM call timeouts. Local inference (Ollama/vLLM) is much
# slower than cloud APIs — raise the stale detector and hard timeout so
# a large review prompt doesn't get killed mid-generation.
providers:
  custom:
    request_timeout_seconds: 3600 # hard cap: 1 h per LLM call
    stale_timeout_seconds: 1800 # declare a stream stale after 30 min of silence

plugins:
  enabled:
    - persist_state # stores todo + delegate_task results to .olympian/PROGRESS.md (durable working memory)
    - web_fetch # free version of web_extract plugin (fetches a web page and returns its main content as markdown)
    - observability/langfuse
    - capture_reasoning # backfills reasoning_content/<think> into the langfuse span so thinking renders in the stream
    - synchronous_delegate # forces delegate_task to run synchronously so the real result returns in-band (captured to PROGRESS.md) and nothing is lost
    - worker_guard # blocks write_file/patch for the IMPLEMENT/REVISE primary (subagents unaffected) so every edit is delegated; the primary may still read to verify

browser:
  inactivity_timeout: 120

compression:
  protect_last_n: 20 # protect last 20 messages / ~10 full turns (default: 20)
  protect_first_n: 5 # pin system prompt + first 5 messages including the plan (default: 3)

# Background auxiliary model timeouts. The Hermes default is 30s — far too short to
# summarise a ~100k-token context on local inference, so the compression call times out
# right when context crosses the threshold and the whole run dies with "no final response".
# Raised well above the main-model prefill time. Tune down if compressions are fast.
# (generateHermesConfig merges provider/model from HERMES_AUXILIARY_* over these.)
auxiliary:
  compression:
    timeout: 900 # seconds
  vision:
    timeout: 900
  web_extract:
    timeout: 900

delegation:
  max_concurrent_children: 2
  # Per delegate_task subagent wall-clock cap. Hermes' default is 600s (10 min) — too short for the
  # substantial subtasks our agents delegate (e.g. "fix all build errors") on slow local inference,
  # where a child steadily making progress (~30s/API call) gets killed mid-work.
  child_timeout_seconds: 3600

agent:
  max_turns: 1000 # default is 90; complex IMPLEMENT/REVISE jobs need far more — HERMES_TIMEOUT_MS is the real backstop
