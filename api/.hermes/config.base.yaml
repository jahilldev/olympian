# Per-provider LLM call timeouts. Local inference (Ollama/vLLM) is much
# slower than cloud APIs — raise the stale detector and hard timeout so
# a large review prompt doesn't get killed mid-generation.
providers:
  custom:
    request_timeout_seconds: 3600 # hard cap: 1 h per LLM call
    stale_timeout_seconds: 1800 # declare a stream stale after 30 min of silence

plugins:
  enabled:
    - web_fetch
    - checkpoint
    - observability/langfuse

browser:
  inactivity_timeout: 120

compression:
  protect_last_n: 20 # protect last 20 messages / ~10 full turns (default: 20)
  protect_first_n: 5 # pin system prompt + first 5 messages including the plan (default: 3)

delegation:
  max_concurrent_children: 2
