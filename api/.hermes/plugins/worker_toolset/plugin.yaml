name: worker_toolset
version: 1.0.0
description: "Registers the 'worker_toolset' toolset — todo, terminal (tests/builds only), and delegation, but NO file read or write tools (read_file/search_files/write_file/patch) — so the IMPLEMENT/REVISE parent can run tests and delegate but must hand ALL reading and editing to subagents (keeping its context small). The orchestrator passes -t worker_toolset for worker-phase parents."
